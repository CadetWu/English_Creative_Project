<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Wiki Template</title>
  <link rel="stylesheet" href="infoPagesStyles.css" />
</head>
<script src="script.js"></script>
<body>

  <main class="page">
    <header class="hero">
      <div>
        <h1>Captain Lance P. Sijan</h1>
      </div>
    </header>

    <section class="content-layout">
      <article class="main-card">
        <h2>Welcome to Sijan's Virtual Museum</h2>

        <div class="grid">
          <div class="wiki-box">
            <h3>Statue</h3>
            
            <div class="gallery-wrapper">
              
            <button class="nav left" onclick="scrollGallery(-1)">❮</button>

              <div class="gallery">
                <div class="story"><img src="imagesSijan/sijanMemorialDoolittle.jpg" alt=""></div>
                <div class="story"><img src="imagesSijan/sijanDescription.jpg" alt=""></div>
              </div>

            <button class="nav right" onclick="scrollGallery(1)">❯</button>

          </div>

          <div class="wiki-box">
            <h3>Painting</h3>
          </div>

          <div class="wiki-box">
            <h3>Poem</h3>
          </div>

          <div class="wiki-box">
            <h3>Memorial</h3>
          </div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
